bypass_zone:
  name: Bypass Zone
  description: Bypass or unbypass a zone on the alarm panel.
  fields:
    zone_id:
      name: Zone ID
      description: The numeric ID of the zone to bypass or unbypass.
      required: true
      example: 1
      selector:
        number:
          min: 1
          mode: box
    bypass:
      name: Bypass
      description: True to bypass the zone, false to unbypass.
      required: true
      default: true
      selector:
        boolean:
